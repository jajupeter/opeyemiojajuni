<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Diagram: connected vehicles train local intrusion-detection models and share updates with an aggregator, not raw data</title>
  <rect width="1200" height="800" fill="#EEF4EF"/>
  <g stroke="#17161A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- aggregator -->
    <rect x="490" y="120" width="220" height="130" rx="18" fill="#2F5BD8" stroke="none" transform="translate(10,8)"/>
    <rect x="490" y="120" width="220" height="130" rx="18" fill="#FFFFFF"/>
    <circle cx="600" cy="170" r="22" stroke="#2F5BD8" stroke-dasharray="6 6"/>
    <circle cx="600" cy="170" r="7" fill="#2F5BD8" stroke="none"/>
    <!-- vehicles -->
    <g>
      <rect x="110" y="520" width="170" height="80" rx="22" fill="#F2C14E" stroke="none" transform="translate(9,7)"/>
      <rect x="110" y="520" width="170" height="80" rx="22" fill="#FFFFFF"/>
      <circle cx="150" cy="606" r="16" fill="#17161A" stroke="none"/><circle cx="240" cy="606" r="16" fill="#17161A" stroke="none"/>
      <rect x="380" y="560" width="170" height="80" rx="22" fill="#D9B8E3" stroke="none" transform="translate(9,7)"/>
      <rect x="380" y="560" width="170" height="80" rx="22" fill="#FFFFFF"/>
      <circle cx="420" cy="646" r="16" fill="#17161A" stroke="none"/><circle cx="510" cy="646" r="16" fill="#17161A" stroke="none"/>
      <rect x="650" y="560" width="170" height="80" rx="22" fill="#8FD1A8" stroke="none" transform="translate(9,7)"/>
      <rect x="650" y="560" width="170" height="80" rx="22" fill="#FFFFFF"/>
      <circle cx="690" cy="646" r="16" fill="#17161A" stroke="none"/><circle cx="780" cy="646" r="16" fill="#17161A" stroke="none"/>
      <rect x="920" y="520" width="170" height="80" rx="22" fill="#F2C14E" stroke="none" transform="translate(9,7)"/>
      <rect x="920" y="520" width="170" height="80" rx="22" fill="#FFFFFF"/>
      <circle cx="960" cy="606" r="16" fill="#17161A" stroke="none"/><circle cx="1050" cy="606" r="16" fill="#17161A" stroke="none"/>
    </g>
    <!-- update arrows (model updates only) -->
    <path d="M200 510 C220 380 420 300 520 262" stroke="#2F5BD8" stroke-dasharray="12 8"/>
    <path d="M465 550 C480 430 540 330 570 262" stroke="#2F5BD8" stroke-dasharray="12 8"/>
    <path d="M735 550 C720 430 660 330 630 262" stroke="#2F5BD8" stroke-dasharray="12 8"/>
    <path d="M1005 510 C985 380 780 300 680 262" stroke="#2F5BD8" stroke-dasharray="12 8"/>
    <!-- shield on one vehicle: flagged message -->
    <circle cx="1040" cy="470" r="18" fill="#D9534F" stroke="none"/>
    <path d="M1032 462 L1048 478 M1048 462 L1032 478" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <text x="600" y="296" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="18" fill="#17161A">aggregator</text>
  <text x="600" y="330" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="15" fill="#2F5BD8">model updates only, no raw data</text>
  <text x="600" y="730" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#17161A">Local intrusion detectors, one shared model</text>
  <text x="40" y="56" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="15" letter-spacing="2" fill="#3D3A35">ILLUSTRATIVE · FEDERATED SETUP</text>
</svg>
