<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Diagram: vehicles inside a roadside unit's coverage send model updates to an aggregator; vehicles outside coverage are missed; an availability predictor estimates who will be reachable in 30 seconds and adjusts their weights</title>
  <rect width="800" height="960" fill="#EEF4EF"/>
  <text x="40" y="56" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="16" letter-spacing="2" fill="#3D3A35">ILLUSTRATIVE · BCMFA</text>
  <g stroke="#17161A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- aggregator -->
    <rect x="290" y="100" width="220" height="110" rx="18" fill="#2F5BD8" stroke="none" transform="translate(9,8)"/>
    <rect x="290" y="100" width="220" height="110" rx="18" fill="#FFFFFF"/>
    <!-- predictor -->
    <rect x="520" y="290" width="230" height="120" rx="18" fill="#F2C14E" stroke="none" transform="translate(9,8)"/>
    <rect x="520" y="290" width="230" height="120" rx="18" fill="#FFFFFF"/>
    <path d="M635 290 C635 240 560 200 515 170" fill="none" stroke="#2F5BD8"/>
    <path d="M522 186 L512 168 L532 164" fill="none" stroke="#2F5BD8"/>
    <!-- road -->
    <path d="M0 720 H800 M0 860 H800" fill="none"/>
    <path d="M0 790 H800" fill="none" stroke-dasharray="26 22" stroke="#8C877E"/>
    <!-- RSU coverage -->
    <circle cx="300" cy="700" r="230" fill="#8FD1A8" fill-opacity="0.28" stroke="#2E8B57" stroke-dasharray="10 9"/>
    <!-- RSU tower -->
    <path d="M300 700 V560" fill="none"/>
    <path d="M276 700 L300 560 L324 700" fill="none"/>
    <circle cx="300" cy="552" r="10" fill="#17161A" stroke="none"/>
    <path d="M320 530 A30 30 0 0 1 320 574 M280 530 A30 30 0 0 0 280 574" fill="none"/>
    <!-- vehicles in coverage -->
    <rect x="120" y="740" width="130" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="152" cy="804" r="12" fill="#17161A" stroke="none"/><circle cx="218" cy="804" r="12" fill="#17161A" stroke="none"/>
    <rect x="330" y="740" width="130" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="362" cy="804" r="12" fill="#17161A" stroke="none"/><circle cx="428" cy="804" r="12" fill="#17161A" stroke="none"/>
    <!-- vehicle leaving coverage -->
    <rect x="600" y="740" width="130" height="60" rx="18" fill="#F4EEE4" stroke="#8C877E" stroke-dasharray="8 7"/>
    <circle cx="632" cy="804" r="12" fill="#8C877E" stroke="none"/><circle cx="698" cy="804" r="12" fill="#8C877E" stroke="none"/>
    <path d="M745 770 H780 M768 758 L780 770 L768 782" fill="none" stroke="#8C877E"/>
    <!-- updates -->
    <path d="M185 735 C200 520 300 330 360 222" fill="none" stroke="#2F5BD8" stroke-dasharray="12 8"/>
    <path d="M395 735 C400 520 410 330 410 222" fill="none" stroke="#2F5BD8" stroke-dasharray="12 8"/>
    <path d="M665 735 C660 640 640 560 620 520" fill="none" stroke="#8C877E" stroke-dasharray="4 10"/>
    <circle cx="610" cy="500" r="16" fill="#D9534F" stroke="none"/>
    <path d="M603 493 L617 507 M617 493 L603 507" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <text x="400" y="150" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="18" fill="#17161A">aggregator</text>
  <text x="400" y="180" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="14" fill="#2F5BD8">reweights updates</text>
  <text x="635" y="336" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="16" fill="#17161A">availability</text>
  <text x="635" y="358" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="16" fill="#17161A">predictor</text>
  <text x="635" y="388" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="15" fill="#2F5BD8">p(reachable in 30 s)</text>
  <text x="300" y="905" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="15" fill="#2E8B57">roadside-unit coverage</text>
  <text x="665" y="905" text-anchor="middle" font-family="Menlo, 'IBM Plex Mono', monospace" font-size="15" fill="#6B665E">out of range: missed</text>
</svg>
