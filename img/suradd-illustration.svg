<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration: a teacher wearing a VR headset beside a clipboard with a pre and post survey bar chart</title>
  <rect width="1200" height="800" fill="#FBF7F1"/>
